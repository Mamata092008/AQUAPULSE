; PlatformIO Project Configuration File for AQUAPULSE Sensor Node
; Team TECHTONICS | Vishwakarma Awards 2026-27 | Host: IIT Hyderabad

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCONFIG_ESP32S3_DEFAULT_CPU_FREQ_240=1
    -DNODE_ID=1
    -DPIPE_SPAN_METRES=150.0

lib_deps =
    adafruit/Adafruit ADS1X15 @ ^2.4.2
    adafruit/RTClib @ ^2.1.3
    adafruit/Adafruit ADXL345 @ ^1.3.4
    fastled/FastLED @ ^3.6.0
